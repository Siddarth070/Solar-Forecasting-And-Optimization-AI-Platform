server {
  listen 8080;
  root /usr/share/nginx/html;

  # The browser calls /api/*; nginx forwards to the FastAPI container,
  # so no CORS is needed in the docker compose setup.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/console, /model) fall back to the app shell.
  location / {
    try_files $uri /index.html;
  }
}
