services:
  # FastAPI serving layer -- overrides the Dockerfile's default CMD.
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    environment:
      # Comma-separated browser origins allowed to call the API (the
      # frontend). Never "*" -- set the real frontend origin per deploy.
      CORS_ALLOW_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 5s

  # Streamlit dashboard -- uses the Dockerfile's default CMD as-is.
  dashboard:
    build: .
    ports:
      - "8501:8501"
