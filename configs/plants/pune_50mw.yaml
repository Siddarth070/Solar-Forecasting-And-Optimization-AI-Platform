# ============================================================
# Plant configuration — pune_50mw
# ============================================================
# Loaded via src.utils.config_loader.get_plant_config("pune_50mw"). Exists
# to prove roadmap P1.1's acceptance criterion: two plants in two different
# states running side by side from the same binary (see
# tests/test_multi_plant.py). Coordinates/state are real, verifiable public
# facts; capacity/panel figures are illustrative placeholders, same as
# jaipur_100mw's. There is no real Pune weather/generation data behind this
# yet — training data is still Jaipur's synthetic simulator only (see
# src/models/train.py's docstring for that limitation).

plant_id: "pune_50mw"
name: "Pune Solar Plant (simulated)"

location:
  name: "Pune"
  state: "Maharashtra"
  latitude: 18.5204
  longitude: 73.8567
  elevation_m: 560
  timezone: "Asia/Kolkata"

capacity:
  ac_capacity_mw: 50
  dc_capacity_mw: 50           # placeholder — DC oversizing not modeled yet
  panel_efficiency: 0.20
  temperature_coefficient: -0.004
  performance_ratio: 0.80
  panel_area_m2: 250000        # scaled from jaipur_100mw's 500,000 m^2 @ 100MW
  tilt_deg: null
  azimuth_deg: null

# Grid/regulatory identifiers — not yet configured (roadmap P1.7)
grid:
  sldc: null
  rldc: null
  ists_or_instate: null
  qca_role: null
  metering_point: null

regulatory:
  dsm_ruleset_id: null
  schedule_format: null
  revision_windows: null
